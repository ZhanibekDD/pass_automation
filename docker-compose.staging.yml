# Staging: Ollama + AI sidecar.
# Ollama и внутренний FastAPI НЕ открываются в интернет.
# Запуск: docker compose -f docker-compose.staging.yml --profile ollama up -d

services:
  ai-api:
    build:
      context: .
      dockerfile: Dockerfile.ai
    env_file:
      - path: .env
        required: false
    environment:
      AI_ENABLED: "true"
      AI_PROVIDER: ollama
      AI_BASE_URL: "http://ollama:11434"
      AI_VISION_MODEL: ${AI_VISION_MODEL:-qwen2.5vl:7b}
      AI_DATABASE_PATH: /workspace/data/ai/pass_docs_ai.sqlite3
      AI_INPUT_JSON: /workspace/data/input/package_input.json
      AI_MAX_FILE_SIZE_MB: "20"
      AI_REQUEST_TIMEOUT_SECONDS: "180"
    ports:
      - "127.0.0.1:${AI_API_PORT:-8090}:8090"
    volumes:
      - ./data/input:/workspace/data/input:ro
      - ai_data_staging:/workspace/data/ai
    depends_on:
      ollama:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=256m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8090/api/ai/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    volumes:
      - ollama_models_staging:/root/.ollama
    expose:
      - "11434"
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  ai_data_staging:
  ollama_models_staging:
