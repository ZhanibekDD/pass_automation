line-length = 110

[lint]
select = ["E", "F", "I", "B", "UP", "S", "BLE"]
ignore = [
  # FastAPI: Depends() в сигнатурах функций — стандартный паттерн
  "B008",
  # try/except в загрузчике токен-файла — намеренно
  "S110",
  "BLE001",
  # pytest.raises(Exception) допустим в тестах безопасности
  "B017",
]

[lint.per-file-ignores]
"tests/*" = ["S", "BLE001"]
