name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install AI dependencies
        run: pip install -r requirements-ai.txt

      - name: Lint (ruff)
        run: python -m ruff check .

      - name: Test (pytest)
        run: python -m pytest tests/ --tb=short -q

      - name: Validate docker-compose staging
        run: docker compose -f docker-compose.staging.yml config --quiet

      - name: Validate docker-compose production
        run: docker compose -f docker-compose.production.yml config --quiet
