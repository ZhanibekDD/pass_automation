# Nginx: Pass Docs AI API.
# AI API не открыт напрямую в интернет — только через этот блок.
# HTTP принудительно редиректит на HTTPS. API по plain HTTP недоступен.
#
# Установка сертификата (один из вариантов):
#   Самоподписанный (для staging):
#     openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
#       -keyout /etc/ssl/private/ai.passdocs.local.key \
#       -out /etc/ssl/certs/ai.passdocs.local.crt \
#       -subj "/CN=ai.passdocs.local"
#
#   Let's Encrypt (если есть DNS):
#     certbot --nginx -d ai.passdocs.local
#
# Разместить: /etc/nginx/sites-enabled/pass-docs-ai

upstream pass_docs_ai {
    server 127.0.0.1:8090;
    keepalive 4;
}

# ── HTTP: только редирект на HTTPS ──────────────────────────────────────────
server {
    listen 80;
    server_name ai.passdocs.local;

    # Health-check от внутреннего мониторинга разрешён по HTTP
    location = /api/ai/health {
        limit_except GET { deny all; }
        proxy_pass http://pass_docs_ai;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto http;
    }

    # Всё остальное — редирект на HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS: основной блок ─────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name ai.passdocs.local;

    ssl_certificate     /etc/ssl/certs/ai.passdocs.local.crt;
    ssl_certificate_key /etc/ssl/private/ai.passdocs.local.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:MozSSL:10m;

    # Строгие заголовки безопасности
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy "no-referrer" always;

    # Health-check открыт без авторизации — только GET
    location = /api/ai/health {
        limit_except GET { deny all; }
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        proxy_pass http://pass_docs_ai;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /api/ai/ {
        # Запрет кеширования ответов API
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;

        # Максимальный размер документа (должен совпадать с AI_MAX_FILE_SIZE_MB)
        client_max_body_size 30M;
        client_body_timeout  60s;
        send_timeout         60s;

        proxy_pass         http://pass_docs_ai;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;

        # Таймаут для долгих vision-запросов
        proxy_read_timeout  300s;
        proxy_send_timeout  300s;
        proxy_connect_timeout 10s;
    }

    # Все остальные пути — закрыть
    location / {
        return 404;
    }
}
